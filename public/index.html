  <!doctype html>
  <html lang="ms">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Mika — 3D Voice Avatar</title>

  <style>
  :root{
    --bg1:#15142f;
    --bg2:#211a3d;
    --card:rgba(35,35,70,.88);
    --text:#f3f3ff;
    --input:#303263;
    --accent:#5b7cff;
    --user:#4b5795;
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    background:
      linear-gradient(
        160deg,
        var(--bg1),
        var(--bg2)
      );
    color:var(--text);
    font-family:
      system-ui,
      -apple-system,
      "Segoe UI",
      sans-serif;
  }

  /* =========================================================
    3D STAGE
  ========================================================= */

  #stage{
    position:relative;
    flex:1;
    min-height:0;
    width:100%;
  }

  #stage canvas{
    display:block;
    width:100%;
    height:100%;
  }

  /* =========================================================
    STATUS
  ========================================================= */

  #status{
    position:absolute;
    top:12px;
    left:12px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:7px 13px;

    border-radius:999px;

    background:var(--card);

    font-size:13px;
    font-weight:600;

    backdrop-filter:blur(8px);

    z-index:10;
  }

  #dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#aab0c0;
  }

  #status.listening #dot{
    background:#ff5252;
    animation:pulse .8s infinite;
  }

  #status.thinking #dot{
    background:#ffb52e;
    animation:pulse .6s infinite;
  }

  #status.speaking #dot{
    background:#35d47a;
    animation:pulse .4s infinite;
  }

  @keyframes pulse{
    50%{
      opacity:.3;
    }
  }

  /* =========================================================
    EXPRESSIONS
  ========================================================= */

  #exp{
    position:absolute;
    top:12px;
    right:12px;

    display:flex;
    gap:8px;

    z-index:10;
  }

  #exp button{
    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:rgba(35,35,70,.9);

    color:white;

    cursor:pointer;

    font-size:18px;

    transition:
      transform .15s,
      background .15s;
  }

  #exp button:hover{
    transform:scale(1.08);
    background:#41457d;
  }

  /* =========================================================
    CHAT PANEL
  ========================================================= */

  #panel{
    width:100%;
    max-width:680px;

    margin:0 auto;

    padding:10px 12px;

    background:var(--card);

    border-radius:18px 18px 0 0;

    backdrop-filter:blur(10px);

    z-index:20;
  }

  #log{
    max-height:145px;

    overflow-y:auto;

    display:flex;
    flex-direction:column;

    gap:6px;

    margin-bottom:8px;
  }

  .m{
    width:fit-content;
    max-width:85%;

    padding:8px 12px;

    border-radius:14px;

    background:#29294f;

    font-size:14px;
  }

  .m.me{
    align-self:flex-end;
    background:var(--user);
  }

  #row{
    display:flex;
    align-items:center;
    gap:6px;
  }

  #lang{
    height:44px;

    border:1px solid #ffffff20;

    border-radius:12px;

    background:var(--input);
    color:white;

    padding:0 10px;

    outline:none;
  }

  #q{
    flex:1;
    min-width:0;

    height:44px;

    border:1px solid #ffffff20;

    border-radius:12px;

    background:var(--input);

    color:white;

    padding:0 13px;

    outline:none;

    font-size:14px;
  }

  #q::placeholder{
    color:#b7b8ce;
  }

  #mic,
  #send{
    width:48px;
    height:44px;

    border:0;
    border-radius:12px;

    background:var(--accent);

    color:white;

    cursor:pointer;

    font-size:18px;
  }

  #mic:hover,
  #send:hover{
    filter:brightness(1.1);
  }

  #mic.on{ background:#ff5252; animation:pulse 1s infinite; }

  /* =========================================================
    MOBILE
  ========================================================= */

  @media(max-width:600px){

    #exp{
      gap:5px;
    }

    #exp button{
      width:38px;
      height:38px;
      font-size:16px;
    }

    #panel{
      padding:8px;
    }

    #lang{
      width:60px;
      padding:0 6px;
    }

    #mic,
    #send{
      width:44px;
    }

  }
  </style>
  </head>

  <body>

  <!-- =======================================================
      3D STAGE
  ======================================================= -->

  <div id="stage">

    <div id="status">
      <span id="dot"></span>
      <span id="st">Idle</span>
    </div>

    <div id="exp">
      <button data-e="neutral">😐</button>
      <button data-e="happy">😊</button>
      <button data-e="think">🤔</button>
      <button data-e="surprised">😮</button>
    </div>

  </div>


  <!-- =======================================================
      CHAT
  ======================================================= -->

  <div id="panel">

    <div id="log"></div>

    <div id="row">

      <select id="lang">
        <option value="ms-MY">BM</option>
        <option value="en-US">EN</option>
        <option value="ja-JP">JP</option>
      </select>

      <input
        id="q"
        type="text"
        placeholder="Taip di sini atau tekan 🎙️"
        autocomplete="off"
      >

      <button
        id="mic"
        type="button"
        title="Cakap"
      >
        🎙️
      </button>

      <button
        id="send"
        type="button"
        title="Hantar"
      >
        ➤
      </button>

    </div>

  </div>


  <!-- =======================================================
      THREE.JS
  ======================================================= -->

  <script type="importmap">
  {
    "imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    }
  }
  </script>


  <script type="module">

  /* =========================================================
    IMPORT
  ========================================================= */

  import * as THREE from "three";

  import {
    GLTFLoader
  } from "three/addons/loaders/GLTFLoader.js";

  import {
    VRMLoaderPlugin,
    VRMUtils
  } from "@pixiv/three-vrm";


  /* =========================================================
    ELEMENTS
  ========================================================= */

  const stage = document.getElementById("stage");
  const status = document.getElementById("status");
  const statusText = document.getElementById("st");
  const log = document.getElementById("log");
  const input = document.getElementById("q");
  const sendButton = document.getElementById("send");
  const micButton = document.getElementById("mic");
  const language = document.getElementById("lang");


  /* =========================================================
    STATE
  ========================================================= */

  let state = "idle";
  let lip = false;
  let open = 0;
  let vrm = null;
  let currentExpression = "neutral";
  let manualExpressionUntil = 0;
  let mouseX = 0;
  let mouseY = 0;
  let blinkStart = -1;
  let nextBlink = 2;


  /* =========================================================
    AUDIO
  ========================================================= */

let audioContext = null;
let analyser = null;
let audioBuffer = null;
let fakeLip = false;


  /* =========================================================
    CHAT HISTORY
  ========================================================= */

  const history = [];


  /* =========================================================
    THREE RENDERER
  ========================================================= */

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  stage.appendChild(renderer.domElement);


  /* =========================================================
    SCENE & CAMERA
  ========================================================= */

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 1.35, 3.2);
  camera.lookAt(0, 1.35, 0);


  /* =========================================================
    LIGHTING
  ========================================================= */

  const hemisphere = new THREE.HemisphereLight(0xffffff, 0x777799, 1.2);
  scene.add(hemisphere);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(2, 4, 5);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xdde5ff, 0.3);
  fillLight.position.set(-3, 2, 2);
  scene.add(fillLight);


  /* =========================================================
    VRM LOADER
  ========================================================= */

  const loader = new GLTFLoader();
  loader.register(parser => new VRMLoaderPlugin(parser));


  /* =========================================================
    EXPRESSIONS
  ========================================================= */

  const expressions = {
    neutral: { happy: 0, surprised: 0 },
    happy: { happy: 1, surprised: 0 },
    think: { happy: 0, surprised: 0 },
    surprised: { happy: 0, surprised: 1 },
    listen: { happy: .25, surprised: 0 }
  };

  function setExpression(name){
    if(!expressions[name]) return;
    currentExpression = name;
  }

  document.querySelectorAll("#exp button").forEach(button => {
    button.addEventListener("click", () => {
      setExpression(button.dataset.e);
      manualExpressionUntil = performance.now() + 4000;
    });
  });


  /* =========================================================
    STATUS
  ========================================================= */

  function setState(value){
    state = value;
    statusText.textContent =
      value === "idle" ? "Idle" :
      value === "listening" ? "Listening..." :
      value === "thinking" ? "Thinking..." :
      value === "speaking" ? "Speaking..." : "Idle";

    status.className = value;

    if(performance.now() > manualExpressionUntil){
      if(value === "speaking") setExpression("happy");
      else if(value === "thinking") setExpression("think");
      else if(value === "listening") setExpression("listen");
      else setExpression("neutral");
    }
  }


  /* =========================================================
    MOUSE & RESIZE
  ========================================================= */

  window.addEventListener("pointermove", event => {
    mouseX = (event.clientX / window.innerWidth - .5) * 2;
    mouseY = (event.clientY / window.innerHeight - .5) * 2;
  });

  function resize(){
    const width = stage.clientWidth;
    const height = stage.clientHeight;

    if(width <= 0 || height <= 0) return;

    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }

  window.addEventListener("resize", resize);
  resize();


  /* =========================================================
    LOAD VRM
  ========================================================= */

  function loadVRM(url){
    console.log("Loading VRM:", url);

    loader.load(
      url,
      gltf => {
        const loadedVRM = gltf.userData.vrm;
        if(!loadedVRM){
          console.error("Fail tidak mengandungi VRM:", gltf);
          return;
        }

        if(vrm) scene.remove(vrm.scene);
        vrm = loadedVRM;

        try {
          if(VRMUtils.rotateVRM0) VRMUtils.rotateVRM0(vrm);
        } catch(error) {
          console.warn("VRM rotation warning:", error);
        }

        scene.add(vrm.scene);

        vrm.scene.traverse(object => {
          object.frustumCulled = false;
          if(object.isMesh && object.material){
            const materials = Array.isArray(object.material) ? object.material : [object.material];
            materials.forEach(material => {
              if(material.map) material.map.colorSpace = THREE.SRGBColorSpace;
              if(material.emissiveMap) material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
              if("emissiveIntensity" in material){
                material.emissiveIntensity = Math.min(material.emissiveIntensity, .5);
              }
            });
          }
        });

        let headPosition = new THREE.Vector3(0, 1.3, 0);
        try {
          const head = vrm.humanoid?.getNormalizedBoneNode("head");
          if(head) head.getWorldPosition(headPosition);
        } catch(error) {
          console.warn("Head bone warning:", error);
        }

        camera.position.set(0, headPosition.y - .15, 3.2);
        camera.lookAt(0, headPosition.y - .15, 0);

        console.log("VRM ready.");
      },
      progress => {
        if(progress.total){
          console.log("VRM loading:", Math.round((progress.loaded / progress.total) * 100) + "%");
        }
      },
      error => {
        console.error("VRM LOAD ERROR:", error);
      }
    );
  }


  /* =========================================================
    VRM EXPRESSION & BLINK
  ========================================================= */

  function updateVRMExpression(){
    if(!vrm || !vrm.expressionManager) return;

    try {
      const expression = expressions[currentExpression] || expressions.neutral;
      vrm.expressionManager.setValue("happy", expression.happy || 0);
      vrm.expressionManager.setValue("surprised", expression.surprised || 0);
      vrm.expressionManager.setValue("aa", Math.min(1, open * 1.1));
      vrm.expressionManager.setValue("blink", getBlinkValue());
    } catch(error) {
      console.warn("Expression warning:", error);
    }
  }

  function getBlinkValue(){
    const time = performance.now() / 1000;
    if(time > nextBlink && blinkStart < 0){
      blinkStart = time;
      nextBlink = time + 2 + Math.random() * 3;
    }
    if(blinkStart < 0) return 0;

    const progress = (time - blinkStart) / .16;
    if(progress >= 1){
      blinkStart = -1;
      return 0;
    }
    return Math.sin(progress * Math.PI);
  }


  /* =========================================================
    LIP LEVEL
  ========================================================= */

  function lipLevel(){
    if(fakeLip) return 0.25 + Math.abs(Math.sin(performance.now() / 90)) * 0.6;
    if(!lip || !analyser || !audioBuffer) return 0;

    try {
      analyser.getByteTimeDomainData(audioBuffer);
      let sum = 0;
      for(let i = 0; i < audioBuffer.length; i++){
        const value = (audioBuffer[i] - 128) / 128;
        sum += value * value;
      }
      return Math.min(1, Math.sqrt(sum / audioBuffer.length) * 5);
    } catch(error) {
      return 0;
    }
  }


  /* =========================================================
    ANIMATION LOOP
  ========================================================= */

  const clock = new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);

    const targetLip = lipLevel();
    open += (targetLip - open) * .3;

    if(vrm){
      try {
        const head = vrm.humanoid?.getNormalizedBoneNode("head");
        if(head){
          head.rotation.y += (mouseX * .15 - head.rotation.y) * .04;
          head.rotation.x += (-mouseY * .08 - head.rotation.x) * .04;
        }
      } catch(error) {}

      try {
        vrm.update(clock.getDelta());
      } catch(error) {
        console.warn("VRM update warning:", error);
      }

      updateVRMExpression();
    }

    renderer.render(scene, camera);
  }

  animate();
  loadVRM("models/mika.vrm");


  /* =========================================================
    CHAT & LOGIC
  ========================================================= */

  function addMessage(text, isUser){
    const element = document.createElement("div");
    element.className = isUser ? "m me" : "m";
    element.textContent = text;
    log.appendChild(element);
    log.scrollTop = log.scrollHeight;
  }

  async function handleMessage(text){
    addMessage(text, true);
    history.push({ role: "user", content: text });

    setState("thinking");

    try {
      const response = await fetch("api/chat.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: history,
          lang: language.value
        })
      });

      const data = await response.json();
      if(!response.ok) throw new Error(data.error || "Chat gagal.");

      const reply = data.text || data.message || "";
      if(!reply) throw new Error("AI tidak memberikan jawapan.");

      history.push({ role: "assistant", content: reply });
      await speak(reply, data.lang);

    } catch(error) {
      console.error(error);
      addMessage("Ralat: " + error.message, false);
      setState("idle");
    }
  }


  /* =========================================================
    TTS (Text to Speech)
  ========================================================= */

 const LANG_MAP = { ms: "ms-MY", en: "en-US", ja: "ja-JP" };

function pickVoice(code){
  const voices = speechSynthesis.getVoices();
  const prefer = [
    v => code === "ms" && /yasmin/i.test(v.name),
    v => code === "en" && /aria|jenny|zira|samantha|google us/i.test(v.name),
    v => code === "ja" && /nanami|haruka|kyoko|google.*日本語|japanese/i.test(v.name),
    v => v.lang.toLowerCase().startsWith(code),
    v => code === "ms" && v.lang.toLowerCase().startsWith("id")
  ];
  for(const test of prefer){
    const found = voices.find(test);
    if(found) return found;
  }
  return null;
}

speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

function speak(text, code){
  // Kalau AI tak bagi tag, guna pilihan dropdown
  code = LANG_MAP[code] ? code : language.value.slice(0, 2).toLowerCase();

  addMessage(text, false);

  return new Promise(resolve => {
    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);
    const voice = pickVoice(code);
    if(voice){ u.voice = voice; u.lang = voice.lang; }
    else { u.lang = LANG_MAP[code] || "ms-MY"; }

    u.pitch = 1.6;
    u.rate  = 1.05;

    const done = () => {
      fakeLip = false;
      lip = false;
      open = 0;
      setState("idle");
      resolve();
    };

    u.onstart = () => {
      fakeLip = true;
      lip = true;
      setState("speaking");
    };
    u.onend = done;
    u.onerror = done;

    speechSynthesis.speak(u);
  });
}


  /* =========================================================
    LISTENERS & RECOGNITION
  ========================================================= */

  sendButton.addEventListener("click", () => {
    const text = input.value.trim();
    if(!text) return;
    input.value = "";
    handleMessage(text);
  });

  input.addEventListener("keydown", event => {
    if(event.key === "Enter"){
      event.preventDefault();
      sendButton.click();
    }
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let micActive = false;   // true selagi user belum klik untuk berhenti
let baseText = "";       // teks yang dah dikumpul sebelum Chrome restart

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = true;        // jangan berhenti bila diam
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    setState("listening");
    micButton.textContent = "⏹";
  };

  recognition.onresult = event => {
    let sessionText = "";
    for(let i = 0; i < event.results.length; i++){
      sessionText += event.results[i][0].transcript;
    }
    input.value = (baseText + " " + sessionText).trim();
  };

  recognition.onerror = event => {
    // no-speech & aborted normal bila diam lama; onend akan restart
    if(event.error === "no-speech" || event.error === "aborted") return;

    console.error("Speech recognition error:", event.error);
    micActive = false;
    micButton.textContent = "🎙️";
    setState("idle");

    if(event.error === "not-allowed"){
      addMessage("Akses mikrofon ditolak. Benarkan mikrofon di ikon kunci sebelah URL.", false);
    }
  };

  recognition.onend = () => {
    if(micActive){
      // Chrome berhenti sendiri -> sambung semula, simpan teks setakat ini
      baseText = input.value.trim();
      setTimeout(() => {
        if(!micActive) return;
        try { recognition.start(); } catch(e) {}
      }, 250);
      return;
    }

    // User dah klik berhenti -> hantar
    micButton.textContent = "🎙️";
    const text = input.value.trim();
    input.value = "";
    baseText = "";

    if(text){
      handleMessage(text);
    } else {
      setState("idle");
    }
  };
}

micButton.addEventListener("click", () => {
  if(!recognition){
    addMessage("Browser ini tidak menyokong speech recognition. Sila guna Google Chrome.", false);
    return;
  }

  if(micActive){
    // Klik kali kedua = berhenti dan hantar
    micActive = false;
    recognition.stop();
  } else {
    speechSynthesis.cancel();      // diamkan Mika kalau tengah bercakap
    input.value = "";
    baseText = "";
    micActive = true;
    recognition.lang = language.value;
    try { recognition.start(); } catch(e) { console.warn(e); }
  }
});


  /* =========================================================
    START MESSAGE
  ========================================================= */

  addMessage("Hai! Saya Mika. Gerakkan kursor untuk melihat avatar mengikuti arah pandangan.", false);

  </script>

  </body>
  </html>
